<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | LPU Food</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3">LPU Food Booking</h1><p class="text-muted">Sign in with your registration number.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><label class="form-label">Registration number</label><input name="registration_number" class="form-control mb-3" required autocomplete="username" placeholder="12345678">
<label class="form-label">Full name <span class="text-muted">(new students)</span></label><input name="full_name" class="form-control mb-3" placeholder="Aayush Kumar">
<label class="form-label">WhatsApp number <span class="text-muted">(new students)</span></label><input name="phone" class="form-control mb-3" inputmode="numeric" placeholder="919876543210">
<button class="btn btn-primary w-100">Continue</button></form></div></div></main></body></html>
